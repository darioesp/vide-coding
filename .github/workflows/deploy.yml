name: Deploy
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type check and lint
        run: deno task check

      - name: Build step
        run: deno task build

      - name: Pre-render pages and assemble dist
        run: |
          set -e
          mkdir -p dist
          cp -r static/. dist/
          cp -r _fresh dist/
          deno run -A main.ts &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          timeout 20 bash -c 'until curl -sf http://localhost:8000/ > /dev/null 2>&1; do sleep 1; done'
          mkdir -p dist/es dist/en
          curl -sf http://localhost:8000/ -o dist/index.html
          curl -sf http://localhost:8000/es -o dist/es/index.html
          curl -sf http://localhost:8000/en -o dist/en/index.html

      - name: Upload build artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: fresh-build
          path: |
            dist/
          retention-days: 1

  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: fresh-build
          path: dist/

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          wranglerVersion: "4.80.0"
